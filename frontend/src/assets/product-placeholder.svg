<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D25"/>
      <stop offset="100%" stop-color="#4A1017"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="376" height="276" rx="12" stroke="#E3D7C5" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Subtle decorative mandala background rings -->
  <circle cx="200" cy="135" r="70" stroke="#E3D7C5" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="135" r="50" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Clay Pot / Traditional Spice Container Silhouette -->
  <!-- Pot base shadow -->
  <ellipse cx="200" cy="195" rx="42" ry="7" fill="#D3C3AD" opacity="0.5"/>
  
  <!-- Pot Body -->
  <path d="M165 130 C150 155, 155 190, 200 190 C245 190, 250 155, 235 130 Z" fill="url(#maroonGrad)"/>
  
  <!-- Pot Neck & Rim -->
  <path d="M172 130 L172 118 C172 115, 178 112, 200 112 C222 112, 228 115, 228 118 L228 130 Z" fill="#58141B"/>
  <ellipse cx="200" cy="113" rx="28" ry="6" fill="url(#goldGrad)"/>
  <ellipse cx="200" cy="113" rx="20" ry="3.5" fill="#4A1017"/>

  <!-- Pot Decorative Band -->
  <path d="M162 148 C180 153, 220 153, 238 148" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  <circle cx="200" cy="151" r="3" fill="#D4AF37"/>
  <circle cx="185" cy="150" r="2" fill="#D4AF37"/>
  <circle cx="215" cy="150" r="2" fill="#D4AF37"/>

  <!-- Grain / Leaf accent -->
  <path d="M200 86 C203 98, 201 106, 200 110 C199 106, 197 98, 200 86 Z" fill="#2E5339"/>
  <path d="M205 92 C213 97, 215 104, 202 108" stroke="#2E5339" stroke-width="1.5" fill="none"/>
  <path d="M195 92 C187 97, 185 104, 198 108" stroke="#2E5339" stroke-width="1.5" fill="none"/>

  <!-- Brand / Placeholder Text -->
  <text x="200" y="228" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#4A1017" letter-spacing="1">RUDRA STORE</text>
  <text x="200" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7A6858" letter-spacing="0.5">Pure &amp; Authentic</text>
</svg>
