<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="420" height="540" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="pouchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58161D"/>
      <stop offset="50%" stop-color="#421015"/>
      <stop offset="100%" stop-color="#2D0A0E"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#DFBC6A"/>
    </linearGradient>

    <!-- Cream Label Gradient -->
    <linearGradient id="creamPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F4EDE0"/>
    </linearGradient>

    <filter id="pouchShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1A0407" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Pouch Silhouette with Rounded Corners -->
  <g filter="url(#pouchShadow)">
    <rect x="20" y="20" width="380" height="500" rx="24" fill="url(#pouchBg)"/>
    <rect x="20" y="20" width="380" height="500" rx="24" stroke="url(#goldLuster)" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Pouch Top Notch and Heat-Seal Pattern -->
  <path d="M20 52 L400 52" stroke="#AA820A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <rect x="20" y="20" width="380" height="28" rx="16" fill="#380C10" opacity="0.5"/>
  <circle cx="210" cy="34" r="5" fill="#D4AF37" opacity="0.7"/>

  <!-- Outer Traditional Gold Decorative Border -->
  <rect x="36" y="66" width="348" height="438" rx="16" stroke="url(#goldLuster)" stroke-width="1.5" fill="none"/>
  <rect x="42" y="72" width="336" height="426" rx="12" stroke="#AA820A" stroke-width="0.8" stroke-dasharray="3 3" fill="none"/>

  <!-- Traditional Corner Floral / Mandala Accents -->
  <!-- Top Left -->
  <path d="M42 90 C56 90, 60 76, 60 72" stroke="url(#goldLuster)" stroke-width="1.5" fill="none"/>
  <circle cx="50" cy="80" r="2.5" fill="#D4AF37"/>

  <!-- Top Right -->
  <path d="M378 90 C364 90, 360 76, 360 72" stroke="url(#goldLuster)" stroke-width="1.5" fill="none"/>
  <circle cx="370" cy="80" r="2.5" fill="#D4AF37"/>

  <!-- Bottom Left -->
  <path d="M42 480 C56 480, 60 494, 60 498" stroke="url(#goldLuster)" stroke-width="1.5" fill="none"/>
  <circle cx="50" cy="490" r="2.5" fill="#D4AF37"/>

  <!-- Bottom Right -->
  <path d="M378 480 C364 480, 360 494, 360 498" stroke="url(#goldLuster)" stroke-width="1.5" fill="none"/>
  <circle cx="370" cy="490" r="2.5" fill="#D4AF37"/>

  <!-- Manufacturer Top Tag -->
  <text x="210" y="98" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#E8D397" letter-spacing="2">MUNAGA ANILKUMAR TRADERS</text>
  <text x="210" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CBB69B" letter-spacing="1.5">S V G MARKET • RAJAHMUNDRY</text>

  <!-- Central Cream Display Emblem -->
  <g>
    <!-- Label Shield / Plaque -->
    <rect x="56" y="128" width="308" height="230" rx="14" fill="url(#creamPanel)"/>
    <rect x="62" y="134" width="296" height="218" rx="10" stroke="url(#goldLuster)" stroke-width="1.2" fill="none"/>
    <rect x="66" y="138" width="288" height="210" rx="8" stroke="#D8C8B4" stroke-width="0.8" stroke-dasharray="2 2" fill="none"/>

    <!-- Subtle Mandala Arc behind Brand -->
    <circle cx="210" cy="216" r="62" stroke="#E3D5C0" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>

    <!-- Top Badge in Plaque -->
    <rect x="135" y="148" width="150" height="20" rx="10" fill="#2E5339"/>
    <text x="210" y="162" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">TRADITIONAL FOODS</text>

    <!-- Main RUDRA Brand Name -->
    <text x="210" y="214" text-anchor="middle" font-family="'Marcellus', 'Georgia', serif" font-size="44" font-weight="700" fill="#421015" letter-spacing="3">RUDRA</text>

    <!-- Brand Decorative Flourish Underline -->
    <path d="M120 228 L190 228 M230 228 L300 228" stroke="url(#goldLuster)" stroke-width="1.5"/>
    <circle cx="210" cy="228" r="4" fill="#C59B27"/>
    <circle cx="202" cy="228" r="2" fill="#421015"/>
    <circle cx="218" cy="228" r="2" fill="#421015"/>

    <!-- Subtitle on Plaque -->
    <text x="210" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#58161D" letter-spacing="2.5">AUTHENTIC QUALITY</text>
    <text x="210" y="272" text-anchor="middle" font-family="'Marcellus', 'Georgia', serif" font-size="11.5" font-style="italic" fill="#786558">Carefully Selected Traditional Groceries</text>

    <!-- Key Products Badge Row in Plaque -->
    <line x1="80" y1="290" x2="340" y2="290" stroke="#E6DAC8" stroke-width="1"/>
    <text x="210" y="310" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#2E5339" letter-spacing="1">RICE FLOUR • GRAM FLOUR • RAGI FLOUR</text>
    <text x="210" y="328" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#2E5339" letter-spacing="1">PUFFED GRAM DAL (PUTNALU)</text>
  </g>

  <!-- Pouch Lower Feature Highlights -->
  <!-- Box 1: Purity -->
  <g transform="translate(60, 376)">
    <rect width="90" height="52" rx="8" fill="#360C10" stroke="#7A2831" stroke-width="1"/>
    <text x="45" y="22" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#D4AF37" letter-spacing="0.5">TRADITIONAL</text>
    <text x="45" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PURITY</text>
  </g>

  <!-- Box 2: Quality -->
  <g transform="translate(165, 376)">
    <rect width="90" height="52" rx="8" fill="#360C10" stroke="#7A2831" stroke-width="1"/>
    <text x="45" y="22" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#D4AF37" letter-spacing="0.5">EVERYDAY</text>
    <text x="45" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">ESSENTIALS</text>
  </g>

  <!-- Box 3: Origin -->
  <g transform="translate(270, 376)">
    <rect width="90" height="52" rx="8" fill="#360C10" stroke="#7A2831" stroke-width="1"/>
    <text x="45" y="22" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#D4AF37" letter-spacing="0.5">ORIGIN</text>
    <text x="45" y="38" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">RAJAHMUNDRY</text>
  </g>

  <!-- Pouch Bottom Contact & Packaging Seal -->
  <line x1="56" y1="446" x2="364" y2="446" stroke="#58161D" stroke-width="1.5"/>
  <text x="210" y="466" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#E8D397" letter-spacing="1">Shop No. B-40, S V G Market, Rajahmundry</text>
  <text x="210" y="484" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FAF3DE" letter-spacing="1">Phone: 9949406863</text>
</svg>
